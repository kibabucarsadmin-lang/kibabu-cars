      <style>
        .kbl{position:fixed;inset:0;display:grid;place-items:center;background:#f3fbfa;z-index:9999;font-family:system-ui,sans-serif}

        @keyframes kbl-road{to{stroke-dashoffset:22}}
        @keyframes kbl-sp{0%,100%{opacity:0;transform:translateX(6px)}50%{opacity:1;transform:none}}
        @media (prefers-reduced-motion:reduce){.kbl-car,.kbl-w,.kbl-road,.kbl-sp line{animation:none}}
